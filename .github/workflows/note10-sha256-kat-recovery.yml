name: Note10 recovery-armed SHA256 diagnostic Image
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sha256-kat-recovery:
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Kbuild tools
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          packages=(clang-14 gcc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi make bc bison flex libssl-dev libelf-dev)
          missing=()
          for package in "${packages[@]}"; do
            if [ "$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)" != "install ok installed" ]; then
              missing+=("$package")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo -n tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            sudo -n env DEBIAN_FRONTEND=noninteractive timeout --kill-after=30s 180s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo -n env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a timeout --kill-after=30s 480s apt-get -o Dpkg::Use-Pty=0 -o DPkg::Lock::Timeout=60 -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y "${missing[@]}"
          fi
      - name: Run only the new command-line policy batch
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B note10/device_test/test_sha256_kat_cmdline_policy.py --output note10/private/v71-ci-cmdline-tests
      - name: Build the new diagnostic Image without historical suites
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B note10/device_test/build_sha256_kat_recovery.py --output note10/private/v71-ci-recovery --jobs 4
      - name: Upload diagnostic build inputs and output evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note10-sha256-kat-recovery-pc-only
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          path: |
            note10/private/v71-ci-cmdline-tests/
            note10/private/v71-ci-recovery/
