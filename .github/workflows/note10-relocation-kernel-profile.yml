name: Note10 PC kernel-option relocation profile
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  kernel-profile:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned PC model tools
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          packages=(clang-14 llvm-14 lld-14)
          missing=()
          for package in "${packages[@]}"; do
            if [ "$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)" != "install ok installed" ]; then
              missing+=("$package")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo -n tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            sudo -n env DEBIAN_FRONTEND=noninteractive timeout --kill-after=30s 180s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo -n env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a timeout --kill-after=30s 480s apt-get -o Dpkg::Use-Pty=0 -o DPkg::Lock::Timeout=60 -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y "${missing[@]}"
          fi
          clang-14 --version
          llvm-objdump-14 --version
          ld.lld-14 --version
          python -m pip download --only-binary=:all: --no-deps unicorn==2.1.4 -d note10/private/v60-dependencies
          python -m pip install --no-index --find-links note10/private/v60-dependencies --no-deps --force-reinstall --report note10/private/v60-dependencies/install-report.json unicorn==2.1.4
      - name: Verify exact pinned native input
        id: native_input
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python note10/device_test/relocation_trial_input.py --output note10/private/v60-ci-input
      - name: Compile and execute kernel-option AArch64 profile
        id: aarch64_execution
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          python note10/device_test/test_relocation_trial_kernel_aarch64.py --profile kernel-init-subset-v1 --payload note10/private/v60-ci-input/payload/kernel.mem --dependency-wheels note10/private/v60-dependencies --output note10/private/v60-ci-model
      - name: Upload kernel-option profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note10-relocation-kernel-profile-pc-only
          if-no-files-found: error
          retention-days: 7
          path: |
            note10/private/v60-ci-input/
            note10/private/v60-ci-model/
            note10/private/v60-dependencies/
