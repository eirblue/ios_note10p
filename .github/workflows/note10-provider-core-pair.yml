name: Note10 provider core pair link
on:
  workflow_dispatch:
    inputs:
      control_sha256:
        description: Exact reviewed committed pair control SHA256
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  provider-core-pair:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Provision GNU linker
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu
      - name: Produce one pair link
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_SHA256: ${{ inputs.control_sha256 }}
        run: |
          python -c "from pathlib import Path; Path('note10/private').mkdir(parents=True, exist_ok=True)"
          python -B note10/device_test/build_provider_core_pair.py --control-sha256 "$CONTROL_SHA256" --output note10/private/v67-ci-pair --workspace note10/private/v67-ci-pair-workspace
      - name: Stage complete evidence
        if: always()
        run: >-
          python -B note10/device_test/stage_provider_core_pair.py
          --source note10/private/v67-ci-pair
          --staging-parent note10/private/v67-upload-staging
          --receipt note10/private/v67-stage-receipt.json
      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note10-provider-core-pair-pc-only
          path: note10/private/v67-upload-staging
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
