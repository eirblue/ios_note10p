name: Note10 v89 Linux DATA guard reasons private Image
on:
  workflow_dispatch:
    inputs:
      recipient_public_key_b64:
        description: Fresh RSA3072 public recipient key only; private key stays local
        required: true
        type: string
      new_cases_json:
        description: Select only the new guard-reason method; old eight cases are excluded
        default: '[]'
        type: string
permissions:
  contents: read
jobs:
  linux-data-carrier:
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate public recipient only
        env:
          N10_RECIPIENT_PUBLIC_KEY_B64: ${{ inputs.recipient_public_key_b64 }}
        run: node note10/device_test/sealed_affinity_artifact.cjs recipient
      - name: Install Kbuild tools
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          packages=(clang-14 gcc gcc-aarch64-linux-gnu libc6-dev-arm64-cross gcc-arm-linux-gnueabi make bc bison flex libssl-dev libelf-dev)
          missing=()
          for package in "${packages[@]}"; do
            if [ "$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)" != "install ok installed" ]; then
              missing+=("$package")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo -n tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            sudo -n env DEBIAN_FRONTEND=noninteractive timeout --kill-after=30s 180s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo -n env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a timeout --kill-after=30s 480s apt-get -o Dpkg::Use-Pty=0 -o DPkg::Lock::Timeout=60 -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y "${missing[@]}"
          fi
      - name: One NEW existing DATA guard-reason method
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          N10_NEW_CASES_JSON: ${{ inputs.new_cases_json }}
        run: python -B note10/device_test/test_linux_data_carrier.py --output note10/private/v89-ci-new-tests
      - name: Compile minimal Linux PID1 and build one new diagnostic Image
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B note10/device_test/build_linux_data_carrier.py --output note10/private/v89-ci-linux-data-carrier --jobs 4
      - name: Bundle and seal private producer evidence including failures
        if: always()
        env:
          N10_RECIPIENT_PUBLIC_KEY_B64: ${{ inputs.recipient_public_key_b64 }}
        run: |
          python -B note10/device_test/bundle_affinity_evidence.py --tests note10/private/v89-ci-new-tests --build note10/private/v89-ci-linux-data-carrier --output note10/private/v89-evidence.zip --source "$GITHUB_SHA"
          node note10/device_test/sealed_affinity_artifact.cjs seal note10/private/v89-evidence.zip note10/private/v89-sealed-evidence.n10sealed "$GITHUB_SHA"
      - name: Upload ciphertext only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note10-v89-sealed-evidence
          if-no-files-found: error
          retention-days: 7
          path: note10/private/v89-sealed-evidence.n10sealed
