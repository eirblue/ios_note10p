name: Note10 v116 PC-first scoped output native candidate
run-name: "v116 scoped output native candidate | ${{ inputs.expected_source_head }}"
on:
  workflow_dispatch:
    inputs:
      expected_source_head:
        description: Exact reviewed public source commit; must equal GITHUB_SHA before fixture or build
        required: true
        type: string
      test_scope:
        description: Only the one NEW native scoped-output fixture and fresh candidate Image; no old fixtures
        required: true
        type: choice
        options:
          - v116-native-scoped-output-candidate-pc-first
      recipient_public_key_b64:
        description: Existing approved RSA3072 public recipient key only; private key stays local
        required: true
        type: string
permissions:
  contents: read
jobs:
  linux-data-carrier:
    if: ${{ inputs.test_scope == 'v116-native-scoped-output-candidate-pc-first' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bind exact reviewed source and new scope
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          N10_EXPECTED_SOURCE_HEAD: ${{ inputs.expected_source_head }}
          N10_TEST_SCOPE: ${{ inputs.test_scope }}
        run: |
          [[ "$N10_EXPECTED_SOURCE_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$N10_EXPECTED_SOURCE_HEAD" ]]
          [[ "$N10_TEST_SCOPE" == "v116-native-scoped-output-candidate-pc-first" ]]
      - name: Validate public recipient only
        env:
          N10_RECIPIENT_PUBLIC_KEY_B64: ${{ inputs.recipient_public_key_b64 }}
        run: node note10/device_test/sealed_affinity_artifact.cjs recipient
      - name: Install Kbuild tools
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          packages=(clang-14 gcc gcc-aarch64-linux-gnu libc6-dev-arm64-cross gcc-arm-linux-gnueabi make bc bison flex libssl-dev libelf-dev)
          missing=()
          for package in "${packages[@]}"; do
            if [ "$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)" != "install ok installed" ]; then
              missing+=("$package")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo -n tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            sudo -n env DEBIAN_FRONTEND=noninteractive timeout --kill-after=30s 180s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo -n env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a timeout --kill-after=30s 480s apt-get -o Dpkg::Use-Pty=0 -o DPkg::Lock::Timeout=60 -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y "${missing[@]}"
          fi
      - name: One NEW native run-to-emit scoped output fixture
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B note10/device_test/test_v116_native_scoped_output.py --scope v116-native-scoped-output-candidate-pc-first --output note10/private/v116-ci-scoped-output-test
      - name: Compile minimal Linux PID1 and build one fresh v116 scoped output candidate Image
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B note10/device_test/build_kernel_readonly_span_candidate.py --producer v116-native-scoped-output-candidate-pc-first --output note10/private/v116-ci-scoped-output-candidate --jobs 4
      - name: Bundle and seal private producer evidence including failures
        if: always()
        env:
          N10_RECIPIENT_PUBLIC_KEY_B64: ${{ inputs.recipient_public_key_b64 }}
        run: |
          python -B note10/device_test/bundle_affinity_evidence.py --tests note10/private/v116-ci-scoped-output-test --build note10/private/v116-ci-scoped-output-candidate --output note10/private/v116-scoped-output-evidence.zip --source "$GITHUB_SHA"
          node note10/device_test/sealed_affinity_artifact.cjs seal note10/private/v116-scoped-output-evidence.zip note10/private/v116-scoped-output-sealed-evidence.n10sealed "$GITHUB_SHA"
      - name: Upload ciphertext only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note10-v116-scoped-output-candidate-sealed-evidence
          if-no-files-found: error
          retention-days: 7
          path: note10/private/v116-scoped-output-sealed-evidence.n10sealed
