name: Note10 PC-only Linux FDT CPU ADT fragment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  new-cpu-fragment-cases:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: One maximal NEW synthetic CPU fragment batch
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B note10/xnu26/test_linux_cpu_adt.py --output note10/private/v74-ci-new-cases
      - name: Upload synthetic case outcomes only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note10-linux-cpu-adt-new-cases
          if-no-files-found: error
          retention-days: 7
          path: note10/private/v74-ci-new-cases/result.json
