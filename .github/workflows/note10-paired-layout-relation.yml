name: Note10 reported paired layout metadata relation
on:
  workflow_dispatch:
    inputs:
      control_sha256:
        description: Exact reviewed committed layout metadata control SHA256
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  paired-layout-relation:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prove reported paired metadata relation
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_SHA256: ${{ inputs.control_sha256 }}
        run: |
          python -c "from pathlib import Path; Path('note10/private').mkdir(parents=True, exist_ok=True)"
          python -B note10/device_test/build_paired_layout_relation.py --control-sha256 "$CONTROL_SHA256" --output note10/private/v68-ci-layout
      - name: Stage complete layout evidence
        if: always()
        run: >-
          python -B note10/device_test/stage_paired_layout_relation.py
          --source note10/private/v68-ci-layout
          --staging-parent note10/private/v68-upload-staging
          --receipt note10/private/v68-stage-receipt.json
      - name: Upload complete layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note10-paired-layout-relation-pc-only
          path: note10/private/v68-upload-staging
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
