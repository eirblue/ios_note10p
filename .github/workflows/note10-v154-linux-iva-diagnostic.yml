name: Bounded Linux IVA diagnostic Image
run-name: "${{ inputs.build_revision }} Linux IVA diagnostic | ${{ inputs.expected_source_head }}"
on:
  workflow_dispatch:
    inputs:
      build_revision:
        description: Exact reviewed Linux diagnostic build revision
        required: true
        default: v155
        type: choice
        options:
          - v155
          - v157
      expected_source_head:
        description: Exact reviewed source HEAD
        required: true
        type: string
      passed_new_test_context:
        description: Exact revision source context and reviewed host PASS metadata
        required: true
        type: string
      recipient_public_key_b64:
        description: Original approved RSA3072 PUBLIC recipient only
        required: true
        type: string
permissions:
  contents: read
jobs:
  v154-linux-iva-diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Guard exact reviewed dispatch
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          N10_EXPECTED_SOURCE: ${{ inputs.expected_source_head }}
          N10_BUILD_REVISION: ${{ inputs.build_revision }}
        run: |
          [[ "$N10_BUILD_REVISION" == v155 || "$N10_BUILD_REVISION" == v157 ]]
          [[ "$N10_EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$N10_EXPECTED_SOURCE" ]]
          [[ "$GITHUB_WORKFLOW_SHA" == "$N10_EXPECTED_SOURCE" ]]
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]]
      - name: Install full Image toolchain
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          packages=(clang-14 gcc gcc-aarch64-linux-gnu libc6-dev-arm64-cross gcc-arm-linux-gnueabi make bc bison flex libssl-dev libelf-dev)
          missing=()
          for package in "${packages[@]}"; do
            if [ "$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)" != "install ok installed" ]; then
              missing+=("$package")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo -n tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            sudo -n env DEBIAN_FRONTEND=noninteractive timeout --kill-after=30s 180s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update
            sudo -n env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a timeout --kill-after=30s 480s apt-get -o Dpkg::Use-Pty=0 -o DPkg::Lock::Timeout=60 install --no-install-recommends -y "${missing[@]}"
          fi
      - name: One full Linux Image and original-Node sealing; no old tests or standalone objects
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          N10_EXPECTED_SOURCE: ${{ inputs.expected_source_head }}
          N10_BUILD_REVISION: ${{ inputs.build_revision }}
          N10_OUTPUT: ${{ inputs.build_revision == 'v157' && 'note10/private/v157-ci-linux-builtin-preexec' || 'note10/private/v154-ci-linux-iva-diagnostic' }}
          N10_NEW_PASS: ${{ inputs.passed_new_test_context }}
          N10_RECIPIENT_PUBLIC_KEY_B64: ${{ inputs.recipient_public_key_b64 }}
        run: '"${{ steps.python.outputs.python-path }}" -B "$GITHUB_WORKSPACE/note10/device_test/v154_linux_build.py" --output "$GITHUB_WORKSPACE/$N10_OUTPUT" --jobs 4 --build-revision "$N10_BUILD_REVISION" --expected-source-head "$N10_EXPECTED_SOURCE" --passed-new-test-context "$N10_NEW_PASS"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.build_revision == 'v157' && 'note10-v157-linux-builtin-preexec-sealed-evidence' || 'note10-v154-linux-iva-diagnostic-sealed-evidence' }}
          path: ${{ inputs.build_revision == 'v157' && 'note10/private/v157-ci-linux-builtin-preexec.n10sealed' || 'note10/private/v154-ci-linux-iva-diagnostic.n10sealed' }}
          retention-days: 7
          if-no-files-found: error
