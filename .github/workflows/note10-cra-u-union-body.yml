name: Note10 reported cra_u union body relation
on:
  workflow_dispatch:
    inputs:
      control_sha256:
        description: Exact reviewed committed finite union control SHA256
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  union-body-relation:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prove reported cra_u body relation
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_SHA256: ${{ inputs.control_sha256 }}
        run: |
          python -c "from pathlib import Path; Path('note10/private').mkdir(parents=True, exist_ok=True)"
          python -B note10/device_test/build_cra_u_union_body_relation.py --control-sha256 "$CONTROL_SHA256" --output note10/private/v69-ci-union-body
      - name: Stage complete union body evidence
        if: always()
        env:
          CONTROL_SHA256: ${{ inputs.control_sha256 }}
        run: >-
          python -B note10/device_test/stage_cra_u_union_body_relation.py
          --control-sha256 "$CONTROL_SHA256"
          --source note10/private/v69-ci-union-body
          --staging-parent note10/private/v69-upload-staging
          --receipt note10/private/v69-stage-receipt.json
      - name: Upload complete union body evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note10-cra-u-union-body-pc-only
          path: note10/private/v69-upload-staging
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
