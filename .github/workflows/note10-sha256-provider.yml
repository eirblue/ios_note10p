name: Note10 actual SHA256 provider object
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  sha256-provider:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Kbuild tools
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          packages=(clang-14 llvm-14 lld-14 gcc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi make bc bison flex libssl-dev libelf-dev)
          missing=()
          for package in "${packages[@]}"; do
            if [ "$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)" != "install ok installed" ]; then
              missing+=("$package")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo -n tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            sudo -n env DEBIAN_FRONTEND=noninteractive timeout --kill-after=30s 180s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo -n env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a timeout --kill-after=30s 480s apt-get -o Dpkg::Use-Pty=0 -o DPkg::Lock::Timeout=60 -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y "${missing[@]}"
          fi
          clang-14 --version
          llvm-objdump-14 --version
          ld.lld-14 --version
      - name: Install exact pinned DWARF parser
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          python -m pip download --only-binary=:all: --no-deps --require-hashes -r note10/device_test/sha256_provider_requirements.txt -d note10/private/v63-dependency-input
          python -m pip install --no-index --find-links note10/private/v63-dependency-input --no-deps --no-compile --require-hashes --target note10/private/v63-dependency-site --report note10/private/v63-dependency-install.json -r note10/device_test/sha256_provider_requirements.txt
      - name: Compile actual SHA256 provider object and static proof
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B note10/device_test/build_sha256_provider.py --output note10/private/v63-ci-provider --archive-profile external-protected-kernel-archive-v1 --elftools-site note10/private/v63-dependency-site --elftools-wheel note10/private/v63-dependency-input/pyelftools-0.32-py3-none-any.whl --install-report note10/private/v63-dependency-install.json
      - name: Upload provider-object evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note10-sha256-provider-pc-only
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: |
            note10/private/v63-ci-provider/
            !note10/private/v63-ci-provider/work/**
