name: Native capture receipt candidate
run-name: "v266 native capture receipt | ${{ inputs.expected_source_head }}"
on:
  workflow_dispatch:
    inputs:
      expected_source_head:
        required: true
        type: string
      passed_new_test_context_b64:
        required: true
        type: string
      recipient_public_key_b64:
        required: true
        type: string
permissions:
  contents: read
jobs:
  v266-genuine-block-driver:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: One source-selected native link with inert genuine block-driver closure
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          N10_EXPECTED_SOURCE_HEAD: ${{ inputs.expected_source_head }}
          N10_NEW_PASS: ${{ inputs.passed_new_test_context_b64 }}
          N10_RECIPIENT_PUBLIC_KEY_B64: ${{ inputs.recipient_public_key_b64 }}
        run: python -B note10/xnu26/phase1_owned_ram_integrated_candidate.py --expected-source-head "$N10_EXPECTED_SOURCE_HEAD" --passed-new-test-context "$N10_NEW_PASS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: note10-v266-genuine-block-driver-sealed-evidence
          path: note10/private/v266-genuine-block-driver.n10sealed
          retention-days: 7
          if-no-files-found: error
