name: Native descriptor preparation Image
run-name: "v211 prepare-only stock parser | ${{ inputs.expected_source_head }}"
on:
  workflow_dispatch:
    inputs:
      expected_source_head:
        required: true
        type: string
      passed_new_test_context:
        required: true
        type: string
      recipient_public_key_b64:
        required: true
        type: string
permissions:
  contents: read
jobs:
  v211-native-prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Guard exact source dispatch
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          EXPECTED: ${{ inputs.expected_source_head }}
        run: |
          [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$EXPECTED" && "$GITHUB_WORKFLOW_SHA" == "$EXPECTED" && "$GITHUB_RUN_ATTEMPT" == 1 ]]
      - name: Install Image toolchain using managed mirrors
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          packages=(clang-14 gcc gcc-aarch64-linux-gnu libc6-dev-arm64-cross gcc-arm-linux-gnueabi make bc bison flex libssl-dev libelf-dev)
          missing=()
          for package in "${packages[@]}"; do
            if [ "$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)" != "install ok installed" ]; then missing+=("$package"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo -n env DEBIAN_FRONTEND=noninteractive timeout --kill-after=30s 180s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update
            sudo -n env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a timeout --kill-after=30s 480s apt-get -o Dpkg::Use-Pty=0 -o DPkg::Lock::Timeout=60 install --no-install-recommends -y "${missing[@]}"
          fi
      - name: One new PID1 and full prepare-only Image
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          N10_HEAD: ${{ inputs.expected_source_head }}
          N10_NEW_PASS: ${{ inputs.passed_new_test_context }}
          N10_RECIPIENT_PUBLIC_KEY_B64: ${{ inputs.recipient_public_key_b64 }}
        run: '"${{ steps.python.outputs.python-path }}" -B "$GITHUB_WORKSPACE/note10/device_test/v211_native_prepare.py" --output "$GITHUB_WORKSPACE/note10/private/v211-ci-native-prepare" --expected-source-head "$N10_HEAD" --passed-new-test-context "$N10_NEW_PASS"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: note10-v211-native-prepare-sealed-evidence
          path: note10/private/v211-ci-native-prepare.n10sealed
          retention-days: 7
          if-no-files-found: error
