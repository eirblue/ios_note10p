name: Note10 temporary handoff kernel build

on:
  workflow_dispatch:
    inputs:
      caps:
        description: Include built-in privileged CPU diagnostic for a future manual boot
        type: boolean
        default: false
      reserve:
        description: Reserve XNU RAM early and use a built-in minimal idle init; no Android root
        type: boolean
        default: false
      window_access:
        description: Test writes and reads only within this boot's checked reservation; no XNU execution
        type: boolean
        default: false
      xnu_stage:
        description: Copy an experimental XNU memory image into reserved RAM and verify SHA256; never execute it
        type: boolean
        default: false
      xnu_artifact_run_id:
        description: Successful run containing note10-experimental-native-build (used only when xnu_stage is true)
        type: string
        default: '39560904016'
      cpu_cache:
        description: Offline/restore secondary CPUs, maintain caches and compare per-CPU payload reads; requires xnu_stage
        type: boolean
        default: false
      pm_timer:
        description: Devices-only suspend/resume test and restored per-CPU timer normalization; requires cpu_cache
        type: boolean
        default: false

      screen_log:
        description: Experimental top-left quarter live diagnostic console; requires auto_return
        type: boolean
        default: false

      gic_roundtrip:
        description: Reversible GICv2 CPU priority mask test after successful PM; requires auto_return
        type: boolean
        default: false

      dma_pm_audit:
        description: Read-only DMA-capable device PM framework snapshots; requires gic_roundtrip
        type: boolean
        default: false

      ufs_pm_audit:
        description: Bundle UFS/HCI, IOMMU, ABOX, guarded noirq CPU hotplug/timer restoration and PMU observations; requires dma_pm_audit
        type: boolean
        default: false

      auto_return:
        description: Opt-in one-shot recovery request; cycle token required at BOOT packaging
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      PLATFORM_VERSION: '11'
      ANDROID_MAJOR_VERSION: r
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux cross compiler and kernel host dependencies
        timeout-minutes: 12
        run: |
          packages=(clang-14 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libc6-dev-arm64-cross libc6-dev-armel-cross make bc bison flex libssl-dev libelf-dev)
          missing=()
          for package in "${packages[@]}"; do
            if [ "$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)" != "install ok installed" ]; then
              missing+=("$package")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            # Keep Ubuntu's signed repositories; avoid the stalled Azure mirror.
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo -n tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            sudo -n env DEBIAN_FRONTEND=noninteractive timeout --kill-after=30s 180s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo -n env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a timeout --kill-after=30s 480s apt-get -o Dpkg::Use-Pty=0 -o DPkg::Lock::Timeout=60 -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y "${missing[@]}"
          fi
          clang-14 --version
          aarch64-linux-gnu-gcc --version
          arm-linux-gnueabi-gcc --version
          command -v aarch64-linux-gnu-elfedit arm-linux-gnueabi-ld
          test -r /usr/aarch64-linux-gnu/include/asm/unistd.h
          test -r /usr/arm-linux-gnueabi/include/asm/unistd.h
      - name: Build the pinned public d2x source with legacy kexec
        env:
          NOTE10_CAPS: ${{ inputs.caps }}
          NOTE10_RESERVE: ${{ inputs.reserve }}
          NOTE10_WINDOW_ACCESS: ${{ inputs.window_access }}
          NOTE10_XNU_STAGE: ${{ inputs.xnu_stage }}
          NOTE10_CPU_CACHE: ${{ inputs.cpu_cache }}
          NOTE10_PM_TIMER: ${{ inputs.pm_timer }}
          NOTE10_AUTO_RETURN: ${{ inputs.auto_return }}
          NOTE10_SCREEN_LOG: ${{ inputs.screen_log }}
          NOTE10_GIC_ROUNDTRIP: ${{ inputs.gic_roundtrip }}
          NOTE10_DMA_PM_AUDIT: ${{ inputs.dma_pm_audit }}
          NOTE10_UFS_PM_AUDIT: ${{ inputs.ufs_pm_audit }}
        run: |
          if [ "$NOTE10_AUTO_RETURN" = true ] && [ "$NOTE10_PM_TIMER" != true ]; then
            echo "auto_return requires pm_timer=true" >&2
            exit 2
          fi
          if [ "$NOTE10_DMA_PM_AUDIT" = true ] && [ "$NOTE10_GIC_ROUNDTRIP" != true ]; then
            echo "dma_pm_audit requires gic_roundtrip=true" >&2
            exit 2
          fi
          if [ "$NOTE10_DMA_PM_AUDIT" = true ]; then
            python note10/device_test/test_dma_pm_contract.py
            python note10/device_test/test_pm_suspend_binding.py
          fi
          if [ "$NOTE10_UFS_PM_AUDIT" = true ]; then
            if [ "$NOTE10_DMA_PM_AUDIT" != true ]; then exit 2; fi
            python note10/device_test/test_ufs_pm_contract.py
            python note10/device_test/test_iommu_pm_contract.py
            python note10/device_test/test_abox_pm_contract.py
            python note10/device_test/test_abox_pmu_contract.py
            python note10/device_test/test_pm_noirq_contract.py
            python note10/device_test/test_pmu_settle_contract.py
            python note10/device_test/test_pm_cpus_contract.py
          fi
          if [ "$NOTE10_GIC_ROUNDTRIP" = true ] && { [ "$NOTE10_AUTO_RETURN" != true ] || [ "$NOTE10_XNU_STAGE" != true ]; }; then
            echo "gic_roundtrip requires auto_return and xnu_stage" >&2
            exit 2
          fi
          if [ "$NOTE10_AUTO_RETURN" = true ]; then
            python note10/device_test/test_auto_cycle_contract.py
          fi
          if [ "$NOTE10_PM_TIMER" = true ] && [ "$NOTE10_CPU_CACHE" != true ]; then
            echo "pm_timer requires cpu_cache=true" >&2
            exit 2
          fi
          if [ "$NOTE10_PM_TIMER" = true ]; then
            python note10/device_test/test_pm_timer_contract.py --report note10/private/handoff-kernel/pm-source-model.json
            python note10/device_test/test_pm_quiesce_decode.py
            python note10/device_test/test_pm_quiesce_binding.py
          fi
          if [ "$NOTE10_CPU_CACHE" = true ] && [ "$NOTE10_XNU_STAGE" != true ]; then
            echo "cpu_cache requires xnu_stage=true" >&2
            exit 2
          fi
          if [ "$NOTE10_XNU_STAGE" = true ]; then
            if [ "$NOTE10_WINDOW_ACCESS" != true ]; then
              echo "xnu_stage requires window_access=true" >&2
              exit 2
            fi
            python note10/device_test/test_window_access_decode.py
            python note10/device_test/test_window_access_core.py --output note10/private/window-access-core-ci
            python note10/device_test/test_window_access_gate.py --output note10/private/window-access-gate-ci
            python note10/device_test/test_xnu_payload_stage.py
            python note10/device_test/test_cpu_cache_decode.py
            python note10/device_test/test_collect_reservation.py
            python note10/device_test/test_boot_test_packages.py
            python note10/device_test/test_reservation_kernel.py
            python note10/device_test/test_reservation_decode.py
            python note10/device_test/test_window_access_decode.py
          elif [ "$NOTE10_WINDOW_ACCESS" = true ]; then
            python note10/device_test/test_window_access_decode.py
            python note10/device_test/test_window_access_core.py --output note10/private/window-access-core-ci
            python note10/device_test/test_window_access_gate.py --output note10/private/window-access-gate-ci
            python note10/device_test/build_handoff_kernel.py --caps --reserve --window-access
          elif [ "$NOTE10_RESERVE" = true ]; then
            python note10/device_test/build_handoff_kernel.py --caps --reserve
          elif [ "$NOTE10_CAPS" = true ]; then
            python note10/device_test/build_handoff_kernel.py --caps
          else
            python note10/device_test/build_handoff_kernel.py
          fi
      - name: Download verified experimental XNU artifact
        if: inputs.xnu_stage
        uses: actions/download-artifact@v4
        with:
          name: note10-experimental-native-build
          run-id: ${{ inputs.xnu_artifact_run_id }}
          github-token: ${{ github.token }}
          path: note10/private/xnu-input
      - name: Materialize XNU data and build integrated diagnostics
        if: inputs.xnu_stage
        env:
          NOTE10_CPU_CACHE: ${{ inputs.cpu_cache }}
          NOTE10_PM_TIMER: ${{ inputs.pm_timer }}
          NOTE10_AUTO_RETURN: ${{ inputs.auto_return }}
          NOTE10_SCREEN_LOG: ${{ inputs.screen_log }}
          NOTE10_GIC_ROUNDTRIP: ${{ inputs.gic_roundtrip }}
          NOTE10_DMA_PM_AUDIT: ${{ inputs.dma_pm_audit }}
          NOTE10_UFS_PM_AUDIT: ${{ inputs.ufs_pm_audit }}
        run: |
          count="$(find note10/private/xnu-input -name note10-experimental.macho -type f | wc -l)"
          [ "$count" -eq 1 ]
          ARTIFACT_DIR="$(dirname "$(find note10/private/xnu-input -name note10-experimental.macho -print -quit)")"
          python note10/xnu26/materialize_stage_payload.py --artifact "$ARTIFACT_DIR" --output note10/private/xnu-stage-payload
          EXTRA=()
          if [ "$NOTE10_CPU_CACHE" = true ]; then
            python note10/device_test/test_cpu_cache_native.py --payload note10/private/xnu-stage-payload/kernel.mem --output note10/private/handoff-kernel/cpu-cache-model
            EXTRA+=(--cpu-cache)
          fi
          if [ "$NOTE10_PM_TIMER" = true ]; then
            python note10/device_test/test_pm_timer_native.py --payload note10/private/xnu-stage-payload/kernel.mem --cpu-model note10/private/handoff-kernel/cpu-cache-model --output note10/private/handoff-kernel/pm-timer-model
            EXTRA+=(--pm-timer)
          fi
          if [ "$NOTE10_AUTO_RETURN" = true ]; then
            python note10/device_test/test_auto_return_native.py --output note10/private/handoff-kernel/auto-return-model
            EXTRA+=(--auto-return)
          fi
          if [ "$NOTE10_SCREEN_LOG" = true ]; then
            if [ "$NOTE10_AUTO_RETURN" != true ]; then exit 2; fi
            python note10/device_test/test_screen_log.py --output note10/private/handoff-kernel/screen-log-model
            python note10/device_test/test_screen_log_binding.py
            EXTRA+=(--screen-log)
          fi
          if [ "$NOTE10_GIC_ROUNDTRIP" = true ]; then
            if [ "$NOTE10_AUTO_RETURN" != true ]; then exit 2; fi
            EXTRA+=(--gic-roundtrip)
          fi
          if [ "$NOTE10_DMA_PM_AUDIT" = true ]; then
            EXTRA+=(--dma-pm-audit)
          fi
          if [ "$NOTE10_UFS_PM_AUDIT" = true ]; then
            EXTRA+=(--ufs-pm-audit)
          fi
          python note10/device_test/build_handoff_kernel.py --caps --reserve --window-access \
            --xnu-payload note10/private/xnu-stage-payload/kernel.mem \
            --xnu-payload-manifest note10/private/xnu-stage-payload/payload-manifest.json "${EXTRA[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: note10-handoff-kernel-pc-only
          retention-days: 7
          if-no-files-found: error
          path: |
            note10/private/handoff-kernel/build-result.json
            note10/private/handoff-kernel/abox-pm-model/result.json
            note10/private/handoff-kernel/abox-pm-model/*.log
            note10/private/handoff-kernel/abox-pmu-model/result.json
            note10/private/handoff-kernel/abox-pmu-model/*.log
            note10/private/handoff-kernel/pm-noirq-model/result.json
            note10/private/handoff-kernel/pm-noirq-model/*.log
            note10/private/handoff-kernel/pm-noirq-pmu-model/result.json
            note10/private/handoff-kernel/pm-noirq-pmu-model/*.log
            note10/private/handoff-kernel/pmu-settle-model/result.json
            note10/private/handoff-kernel/pmu-settle-model/*.log
            note10/private/handoff-kernel/pm-cpus-model/result.json
            note10/private/handoff-kernel/pm-cpus-model/*.log
            note10/private/handoff-kernel/pm-cpus-pmu-model/result.json
            note10/private/handoff-kernel/pm-cpus-pmu-model/*.log
            note10/private/handoff-kernel/pm-cpus-hotplug-model/result.json
            note10/private/handoff-kernel/pm-cpus-hotplug-model/*.log
            note10/private/handoff-kernel/pm-cpus-timer-model/result.json
            note10/private/handoff-kernel/pm-cpus-timer-model/*.log
            note10/private/handoff-kernel/pm-cpus-queue-model/result.json
            note10/private/handoff-kernel/pm-cpus-queue-model/*.log
            note10/private/handoff-kernel/fsys-pm-model/result.json
            note10/private/handoff-kernel/fsys-pm-model/*.log
            note10/private/handoff-kernel/iommu-pm-model/result.json
            note10/private/handoff-kernel/iommu-pm-model/*.log
            note10/private/handoff-kernel/ufs-pm-model/result.json
            note10/private/handoff-kernel/ufs-pm-model/*.log
            note10/private/handoff-kernel/dma-pm-model/result.json
            note10/private/handoff-kernel/dma-pm-model/*.log
            note10/private/handoff-kernel/*.log
            note10/private/handoff-kernel/*.config
            note10/private/handoff-kernel/Image
            note10/private/handoff-kernel/minimal-init.elf
            note10/private/handoff-kernel/initramfs.cpio
            note10/private/handoff-kernel/cpu-cache-model/result.json
            note10/private/handoff-kernel/cpu-cache-model/compile.log
            note10/private/handoff-kernel/cpu-cache-model/mode-0.txt
            note10/private/handoff-kernel/pm-timer-model/result.json
            note10/private/handoff-kernel/pm-timer-model/compile.log
            note10/private/handoff-kernel/pm-source-model.json
            note10/private/handoff-kernel/pm-quiesce-model/result.json
            note10/private/handoff-kernel/pm-quiesce-model/*.log
            note10/private/handoff-kernel/pm-usb-model/result.json
            note10/private/handoff-kernel/pm-usb-model/compile.log
            note10/private/handoff-kernel/gic-roundtrip-model/result.json
            note10/private/handoff-kernel/gic-roundtrip-model/*.log
            note10/private/handoff-kernel/screen-log-model/result.json
            note10/private/handoff-kernel/screen-log-model/compile.log
            note10/private/handoff-kernel/auto-return-model/result.json
            note10/private/handoff-kernel/auto-return-model/compile.log
            note10/private/window-access-core-ci/result.json
            note10/private/window-access-gate-ci/result.json
