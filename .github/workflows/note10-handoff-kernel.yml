name: Note10 temporary handoff kernel build

on:
  workflow_dispatch:
    inputs:
      caps:
        description: Include built-in privileged CPU diagnostic for a future manual boot
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux cross compiler and kernel host dependencies
        run: |
          timeout 360s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          timeout 480s sudo apt-get -o DPkg::Lock::Timeout=90 -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y clang-14 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi make bc bison flex libssl-dev libelf-dev
      - name: Build the pinned public d2x source with legacy kexec
        env:
          PLATFORM_VERSION: '11'
          ANDROID_MAJOR_VERSION: r
          NOTE10_CAPS: ${{ inputs.caps }}
        run: |
          if [ "$NOTE10_CAPS" = true ]; then
            python note10/device_test/build_handoff_kernel.py --caps
          else
            python note10/device_test/build_handoff_kernel.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: note10-handoff-kernel-pc-only
          retention-days: 7
          if-no-files-found: error
          path: |
            note10/private/handoff-kernel/build-result.json
            note10/private/handoff-kernel/*.log
            note10/private/handoff-kernel/*.config
            note10/private/handoff-kernel/Image
