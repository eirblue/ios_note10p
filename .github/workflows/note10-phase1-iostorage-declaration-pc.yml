name: Note10 Phase 1 public IOStorage SDK probe
run-name: "Phase 1 IOStorage ${{ inputs.mode || 'declaration' }} | ${{ inputs.expected_source_head }}"
on:
  workflow_dispatch:
    inputs:
      expected_source_head:
        description: Exact independently reviewed source HEAD
        required: true
        type: string
      mode:
        description: Public SDK source to check
        default: declaration
        required: true
        type: choice
        options:
          - declaration
          - pio_bridge
          - pio_link
          - provider_object
          - base_object
permissions:
  contents: read
jobs:
  iostorage-public-declaration:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check selected public IOStorage inputs
        env:
          N10_EXPECTED_SOURCE_HEAD: ${{ inputs.expected_source_head }}
          N10_PROBE_MODE: ${{ inputs.mode }}
        run: python -B note10/xnu26/phase1_iostorage_declaration.py --mode "${N10_PROBE_MODE:-declaration}" --output note10/private/phase1-iostorage-declaration-once
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ format('note10-phase1-iostorage-{0}-result', inputs.mode == 'base_object' && 'base-object' || inputs.mode == 'provider_object' && 'provider-object' || inputs.mode == 'pio_link' && 'pio-link' || inputs.mode == 'pio_bridge' && 'pio-bridge' || 'declaration') }}
          path: note10/private/phase1-iostorage-declaration-once/result.json
          retention-days: 7
          if-no-files-found: error
