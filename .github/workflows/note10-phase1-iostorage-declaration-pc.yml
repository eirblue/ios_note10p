name: Note10 Phase 1 public IOStorage SDK probe
run-name: "Phase 1 IOStorage ${{ inputs.mode || 'declaration' }} | ${{ inputs.expected_source_head }}"
on:
  workflow_dispatch:
    inputs:
      expected_source_head:
        description: Exact independently reviewed source HEAD
        required: true
        type: string
      mode:
        description: Public SDK source to check
        default: declaration
        required: true
        type: choice
        options:
          - declaration
          - pio_bridge
          - pio_link
          - provider_object
          - base_object
          - native_inputs
          - native_complete
          - relocatable_closure
          - user_instruction_object
          - user_instruction_diagnostics
          - user_instruction_header_context
          - user_auth_branch_object
          - user_auth_branch_closure
          - memdev_wide_extent
          - memdev_context_observation
          - user_exception_fetch
          - readonly_ram_provider_object
permissions:
  contents: read
jobs:
  iostorage-public-declaration:
    runs-on: macos-26
    timeout-minutes: ${{ (inputs.mode == 'user_exception_fetch' || inputs.mode == 'native_inputs' || inputs.mode == 'native_complete' || inputs.mode == 'relocatable_closure' || inputs.mode == 'user_instruction_object' || inputs.mode == 'user_instruction_diagnostics' || inputs.mode == 'user_instruction_header_context' || inputs.mode == 'user_auth_branch_object' || inputs.mode == 'user_auth_branch_closure' || inputs.mode == 'memdev_wide_extent' || inputs.mode == 'memdev_context_observation') && 30 || 10 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check selected public IOStorage inputs
        env:
          N10_EXPECTED_SOURCE_HEAD: ${{ inputs.expected_source_head }}
          N10_PROBE_MODE: ${{ inputs.mode }}
        run: |
          case "$N10_PROBE_MODE" in
            readonly_ram_provider_object)
              mkdir -p note10/private
              python -B note10/xnu26/phase1_readonly_ram_block_device.py --output note10/private/v202-readonly-ram-provider-once > note10/private/v202-readonly-ram-provider.internal.log 2>&1
              ;;
            user_exception_fetch)
              mkdir -p note10/private
              python -B note10/xnu26/phase1_user_exception_fetch.py --output note10/private/v198-user-exception-fetch-once > note10/private/v198-user-exception-fetch.internal.log 2>&1
              ;;
            memdev_context_observation)
              mkdir -p note10/private
              python -B note10/xnu26/phase1_iostorage_declaration.py --mode "$N10_PROBE_MODE" --output note10/private/v169-memdev-context-observation-once > note10/private/v169-memdev-context-observation.internal.log 2>&1
              ;;
            memdev_wide_extent)
              mkdir -p note10/private
              python -B note10/xnu26/phase1_iostorage_declaration.py --mode "$N10_PROBE_MODE" --output note10/private/v168-memdev-wide-extent-once > note10/private/v168-memdev-wide-extent.internal.log 2>&1
              ;;
            user_auth_branch_closure)
              mkdir -p note10/private
              python -B note10/xnu26/phase1_iostorage_declaration.py --mode "$N10_PROBE_MODE" --output note10/private/v166-user-auth-branch-closure-once > note10/private/v166-user-auth-branch-closure.internal.log 2>&1
              ;;
            user_auth_branch_object)
              mkdir -p note10/private
              python -B note10/xnu26/phase1_iostorage_declaration.py --mode "$N10_PROBE_MODE" --output note10/private/v165-user-auth-branch-object-once > note10/private/v165-user-auth-branch-object.internal.log 2>&1
              ;;
            user_instruction_header_context)
              mkdir -p note10/private
              python -B note10/xnu26/phase1_iostorage_declaration.py --mode "$N10_PROBE_MODE" --output note10/private/v164-user-instruction-header-context-once > note10/private/v164-user-instruction-header-context.internal.log 2>&1
              ;;
            user_instruction_diagnostics)
              mkdir -p note10/private
              python -B note10/xnu26/phase1_iostorage_declaration.py --mode "$N10_PROBE_MODE" --output note10/private/v163-user-instruction-diagnostics-once > note10/private/v163-user-instruction-diagnostics.internal.log 2>&1
              ;;
            user_instruction_object)
              mkdir -p note10/private
              python -B note10/xnu26/phase1_iostorage_declaration.py --mode "$N10_PROBE_MODE" --output note10/private/v162-user-instruction-object-once > note10/private/v162-user-instruction-object.internal.log 2>&1
              ;;
            native_inputs|native_complete|relocatable_closure)
              mkdir -p note10/private
              python -B note10/xnu26/phase1_iostorage_declaration.py --mode "$N10_PROBE_MODE" --output note10/private/phase1-iostorage-declaration-once > note10/private/phase1-iostorage-native.internal.log 2>&1
              ;;
            *)
              python -B note10/xnu26/phase1_iostorage_declaration.py --mode "${N10_PROBE_MODE:-declaration}" --output note10/private/phase1-iostorage-declaration-once
              ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.mode == 'readonly_ram_provider_object' && 'note10-v202-readonly-ram-provider-result' || inputs.mode == 'user_exception_fetch' && 'note10-v198-user-exception-fetch-result' || inputs.mode == 'memdev_context_observation' && 'note10-v169-memdev-context-observation-result' || inputs.mode == 'memdev_wide_extent' && 'note10-v168-memdev-wide-extent-result' || inputs.mode == 'user_auth_branch_closure' && 'note10-v166-user-auth-branch-closure-result' || inputs.mode == 'user_auth_branch_object' && 'note10-v165-user-auth-branch-object-result' || inputs.mode == 'user_instruction_header_context' && 'note10-v164-user-instruction-header-context-result' || inputs.mode == 'user_instruction_diagnostics' && 'note10-v163-user-instruction-diagnostics-result' || inputs.mode == 'user_instruction_object' && 'note10-v162-user-instruction-object-result' || format('note10-phase1-iostorage-{0}-result', inputs.mode == 'relocatable_closure' && 'relocatable-closure' || inputs.mode == 'native_complete' && 'native-complete' || inputs.mode == 'native_inputs' && 'native-inputs' || inputs.mode == 'base_object' && 'base-object' || inputs.mode == 'provider_object' && 'provider-object' || inputs.mode == 'pio_link' && 'pio-link' || inputs.mode == 'pio_bridge' && 'pio-bridge' || 'declaration') }}
          path: ${{ inputs.mode == 'readonly_ram_provider_object' && 'note10/private/v202-readonly-ram-provider-once/result.json' || inputs.mode == 'user_exception_fetch' && 'note10/private/v198-user-exception-fetch-once/result.json' || inputs.mode == 'memdev_context_observation' && 'note10/private/v169-memdev-context-observation-once/result.json' || inputs.mode == 'memdev_wide_extent' && 'note10/private/v168-memdev-wide-extent-once/result.json' || inputs.mode == 'user_auth_branch_closure' && 'note10/private/v166-user-auth-branch-closure-once/result.json' || inputs.mode == 'user_auth_branch_object' && 'note10/private/v165-user-auth-branch-object-once/result.json' || inputs.mode == 'user_instruction_header_context' && 'note10/private/v164-user-instruction-header-context-once/result.json' || inputs.mode == 'user_instruction_diagnostics' && 'note10/private/v163-user-instruction-diagnostics-once/result.json' || inputs.mode == 'user_instruction_object' && 'note10/private/v162-user-instruction-object-once/result.json' || 'note10/private/phase1-iostorage-declaration-once/result.json' }}
          retention-days: 7
          if-no-files-found: error
